name: CI

on:
  push:
  pull_request:

jobs:
  build-windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace
