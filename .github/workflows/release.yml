name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & attach release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Package portable binaries
        shell: pwsh
        run: |
          $dir = "claude-aegis-${{ github.ref_name }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/claude-aegis.exe $dir/
          Copy-Item target/release/claude-aegis-proxy.exe $dir/
          Copy-Item target/release/claude-aegis-gui.exe $dir/
          Copy-Item README.md $dir/
          Copy-Item README.zh.md $dir/
          Copy-Item LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build NSIS installer
        working-directory: gui/src-tauri
        run: tauri build

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            claude-aegis-*.zip
            target/release/bundle/nsis/*.exe
